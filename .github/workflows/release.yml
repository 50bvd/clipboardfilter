name: Build & Release

# - push to develop   -> pre-production builds, downloadable from the run (Artifacts)
# - tag vX.Y.Z-beta.N -> GitHub pre-release with the installers
# - tag vX.Y.Z        -> GitHub release with the installers
# - "Run workflow" (Actions tab) with a tag -> same as pushing that tag,
#   from the selected branch (no git command needed)
on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, e.g. v1.2.0 or v1.2.0-beta.1 (must match package.json). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    env:
      # Present only once SignPath is configured (see docs/CODE_SIGNING.md).
      # When empty, the signing steps below are skipped and the unsigned
      # installer is published exactly as before.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the requested version
        if: inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid tag '$TAG' (expected vX.Y.Z or vX.Y.Z-beta.N)"; exit 1
          fi
          VERSION="v$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"; exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Package
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux)   npm run package:linux -- --publish never ;;
            windows) npm run package:win -- --publish never ;;
            mac)     npm run package:mac -- --publish never ;;
          esac

      # --- Code signing (SignPath Foundation, free for OSS) ---------------------
      # Signs the Windows installer(s) produced above. Runs ONLY for Windows
      # release/tag builds AND only when SIGNPATH_API_TOKEN is configured, so
      # regular CI, forks and pre-onboarding builds keep working unsigned.
      # Setup: docs/CODE_SIGNING.md. The signed files overwrite release/*.exe,
      # so the existing upload/publish steps distribute the signed installer.
      - name: Upload unsigned Windows installer (for signing)
        id: unsigned_win
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clipboardfilter-windows-unsigned
          path: release/*.exe
          retention-days: 1

      - name: Sign Windows installer with SignPath
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'clipboardfilter' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned_win.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ClipboardFilter-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/*.AppImage
            release/*.dmg
            release/*.zip
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
